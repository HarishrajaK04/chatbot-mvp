<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot MVP</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">Chatbot MVP</span>
      </div>
      <button id="new-chat-btn" class="new-chat-btn" title="Start a new conversation">
        New Chat
      </button>
    </header>

    <main id="messages" class="messages">
      <div class="empty-state" id="empty-state">
        <p>Say something to start the conversation.</p>
      </div>
    </main>

    <form id="chat-form" class="chat-form">
      <textarea
        id="chat-input"
        class="chat-input"
        placeholder="Type a message..."
        rows="1"
        autofocus
      ></textarea>
      <button id="send-btn" type="submit" class="send-btn" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 11.5L21 3L13.5 21L11 13L3 11.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
